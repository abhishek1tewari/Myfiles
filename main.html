<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Be My Valentine 💘</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            padding-top: 80px;
        }
        h1 { color: white; font-size: 42px; }
        button {
            font-size: 20px;
            padding: 12px 30px;
            margin: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            position: relative;
        }
        .yes { background-color: #4CAF50; color: white; }
        .no { background-color: #f44336; color: white; }
        #result { margin-top: 30px; font-size: 24px; color: white; }
        img { margin-top: 20px; width: 260px; border-radius: 15px; }
    </style>
</head>
<body>

<h1>Will you be my Valentine? 💖</h1>

<button class="yes" onclick="yesClicked()">Yes 💃</button>
<button class="no" id="noBtn">No 😬</button>

<div id="result"></div>

<script>
    const noBtn = document.getElementById("noBtn");

    function randomPosition(button) {
        const x = Math.random() * (window.innerWidth - button.offsetWidth);
        const y = Math.random() * (window.innerHeight - button.offsetHeight - 100);
        button.style.position = 'absolute';
        button.style.left = x + 'px';
        button.style.top = y + 'px';
    }

    noBtn.addEventListener("mouseover", () => { randomPosition(noBtn); });

    function noClicked() {
        document.getElementById("result").innerHTML = `
            <p>😿 Meow Meow Meow 😿</p>
            <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif">
        `;
    }

    function yesClicked() {
        document.getElementById("result").innerHTML = `
            <p>YAYYYY!! 💖🕺</p>
            <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExa2htNXZmbW5iNjR3aDkzcDFwOXp3ejczN2dra2wxNnk4enN3djhkYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif">
        `;
    }
</script>

</body>
</html>
